name: Morning Brief

on:
  schedule:
    - cron: "40 1 * * *"   # 05:40 Dubai every day (GitHub can run 10-30 min late)
  workflow_dispatch:       # lets you run it any time from the Actions tab

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
