name: Morning Brief

on:
  schedule:
    - cron: "40 1 * * *"   # 05:40 Dubai every day (GitHub can run 10-30 min late)
  workflow_dispatch:       # lets you run it any time from the Actions tab

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Write today's brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_KEY:       ${{ secrets.SERPAPI_KEY }}
          SERPAPI_PER_DAY:   "5"
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
          APP_URL:           https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          OUTPUT_DIR: docs/data
        run: python brief.py

      - name: Publish
        run: |
          git config user.name  "Morning Brief Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "Brief for $(TZ=Asia/Dubai date +'%Y-%m-%d')"
          git push
